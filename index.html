<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Agendar lembrete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      border-radius: 12px;
      padding: 24px 20px 28px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .hero-image {
      max-width: 160px;
      width: 100%;
      margin: 0 auto 16px;
      display: block;
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: #111;
    }

    p.texto-central {
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    #btn-agendar {
      display: inline-block;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #c4161c; /* cor estilo banco */
      color: #fff;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    #btn-agendar:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    #btn-agendar:disabled {
      opacity: 0.7;
      cursor: default;
      box-shadow: none;
    }

    .click-info {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #666;
    }

    .click-info span {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TROQUE o src pela imagem desejada -->
    <img
      src="https://gsvc.pgmais.com.br/comercial/RCS/Bradesco/AGENDA.PNG"
      alt="BRADESCO"
      class="hero-image"
    />

    <h1>Acordo de pagamento</h1>

    <p class="texto-central">
      Você tem um acordo de pagamento com o BRADESCO.<br />
      Clique no botão abaixo e programe um lembrete na agenda do celular.<br />
      Caso já tenha pago, desconsidere.
    </p>

    <button id="btn-agendar">Agendar lembrete</button>

    <p class="click-info">
      Cliques no botão: <span id="click-count">0</span>
    </p>
  </div>

  <script>
    // Contador de cliques
    let clickCount = 0;
    const btnAgendar = document.getElementById('btn-agendar');
    const clickCountSpan = document.getElementById('click-count');

    // Pega a data de "hoje" em America/Sao_Paulo e soma N dias
    function getDataSaoPauloMais(dias) {
      const agora = new Date();

      const spString = agora.toLocaleString('en-CA', {
        timeZone: 'America/Sao_Paulo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      const [dataParte] = spString.split(','); // "YYYY-MM-DD"
      const [ano, mes, dia] = dataParte.split('-').map(Number);

      const spDate = new Date(ano, mes - 1, dia + dias);

      const y = spDate.getFullYear();
      const m = String(spDate.getMonth() + 1).padStart(2, '0');
      const d = String(spDate.getDate()).padStart(2, '0');

      return { y, m, d, ymd: `${y}${m}${d}` };
    }

    // Data de hoje em UTC-3 + 2 dias
    const { ymd: data } = getDataSaoPauloMais(2);

    // Horário fixo: 08:00–09:00 em UTC-3 → 11:00–12:00 UTC
    const inicioUTC = `${data}T110000Z`;
    const fimUTC    = `${data}T120000Z`;

    const titulo   = encodeURIComponent('Agendamento teste');
    const detalhes = encodeURIComponent('Agendamento automático');

    // URL web do Google Calendar (funciona em tudo)
    const googleURL =
      `https://calendar.google.com/calendar/render` +
      `?action=TEMPLATE&text=${titulo}&dates=${inicioUTC}%2F${fimUTC}&details=${detalhes}`;

    // Intent pro app (Android + Chrome, se der certo)
    const googleIntentURL =
      `intent://calendar.google.com/calendar/render` +
      `?action=TEMPLATE&text=${titulo}&dates=${inicioUTC}%2F${fimUTC}&details=${detalhes}` +
      `#Intent;scheme=https;package=com.google.android.calendar;end`;

    // .ics pra iOS / Outlook / Apple Calendar
    function gerarICS() {
      const conteudoICS = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Agendamento teste
DTSTART:${inicioUTC}
DTEND:${fimUTC}
DESCRIPTION:Agendamento automático
END:VEVENT
END:VCALENDAR`;

      const blob = new Blob([conteudoICS], { type: 'text/calendar;charset=utf-8' });
      return URL.createObjectURL(blob);
    }

    // Detecta dispositivo
    const ua = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isChrome = /Chrome/i.test(ua);

    btnAgendar.addEventListener('click', function () {
      // soma 1 clique
      clickCount++;
      clickCountSpan.textContent = clickCount;

      if (isIOS) {
        // iPhone / iPad → abre arquivo .ics
        window.location.href = gerarICS();
      } else if (isAndroid && isChrome) {
        // Android + Chrome → tenta app via intent
        window.location.href = googleIntentURL;
      } else {
        // Desktop, outros browsers, etc. → web
        window.location.href = googleURL;
      }
    });
  </script>
</body>
</html>
