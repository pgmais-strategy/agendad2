<button id="btn-agendar">Agendar</button>

<script>
// Pega a data de "hoje" em America/Sao_Paulo e soma N dias
function getDataSaoPauloMais(dias) {
  const agora = new Date();

  const spString = agora.toLocaleString('en-CA', {
    timeZone: 'America/Sao_Paulo',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });

  const [dataParte] = spString.split(','); // "YYYY-MM-DD"
  const [ano, mes, dia] = dataParte.split('-').map(Number);

  const spDate = new Date(ano, mes - 1, dia + dias);

  const y = spDate.getFullYear();
  const m = String(spDate.getMonth() + 1).padStart(2, '0');
  const d = String(spDate.getDate()).padStart(2, '0');

  return { y, m, d, ymd: `${y}${m}${d}` };
}

// Data de hoje em UTC-3 + 2 dias
const { ymd: data } = getDataSaoPauloMais(2);

// Horário fixo: 08:00–09:00 em UTC-3 → 11:00–12:00 UTC
const inicioUTC = `${data}T110000Z`;
const fimUTC    = `${data}T120000Z`;

const titulo   = encodeURIComponent('Agendamento');
const detalhes = encodeURIComponent('Agendamento automático');

// URL web do Google Calendar (funciona em tudo)
const googleURL =
  `https://calendar.google.com/calendar/render` +
  `?action=TEMPLATE&text=${titulo}&dates=${inicioUTC}%2F${fimUTC}&details=${detalhes}`;

// Intent pro app (Android + Chrome, se der certo)
const googleIntentURL =
  `intent://calendar.google.com/calendar/render` +
  `?action=TEMPLATE&text=${titulo}&dates=${inicioUTC}%2F${fimUTC}&details=${detalhes}` +
  `#Intent;scheme=https;package=com.google.android.calendar;end`;

// .ics pra iOS / Outlook / Apple Calendar
function gerarICS() {
  const conteudoICS = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Agendamento
DTSTART:${inicioUTC}
DTEND:${fimUTC}
DESCRIPTION:Agendamento automático
END:VEVENT
END:VCALENDAR`;

  const blob = new Blob([conteudoICS], { type: 'text/calendar;charset=utf-8' });
  return URL.createObjectURL(blob);
}

// Detecta dispositivo
const ua = navigator.userAgent;
const isAndroid = /Android/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua);
const isChrome = /Chrome/i.test(ua);

document.getElementById('btn-agendar').addEventListener('click', function () {
  if (isIOS) {
    // iPhone / iPad → abre arquivo .ics
    window.location.href = gerarICS();
  } else if (isAndroid && isChrome) {
    // Android + Chrome → tenta app, se falhar fica no navegador
    window.location.href = googleIntentURL;
    // se o intent falhar, o Chrome normalmente cai pro navegador web
  } else {
    // Desktop, outros browsers, etc. → web
    window.location.href = googleURL;
  }
});
</script>
